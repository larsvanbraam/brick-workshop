    <meta

    <title>Brick Workshop</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Brick Workshop" />
    <meta property="og:title" content="Brick Workshop" />
    <meta
      property="og:description"
      content="Design brick models in your browser. Build, validate and print step-by-step instructions with real LDraw parts."
    />
    <meta property="og:url" content="https://brick-workshop-claude-adapter.vercel.app/" />
    <meta

      name="twitter:description"
      content="Design brick models in your browser. Build, validate and print step-by-step instructions with real LDraw parts."
    />
    <meta
      name="twitter:image"
      content="https://brick-workshop-claude-adapter.vercel.app/og-image.jpg"
    />
    <style>
      #workshop-loading {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-content: center;
        gap: 18px;
        padding: 24px;
        background: #f8f9f7;
        color: #303832;
        font-family: 'IBM Plex Sans', sans-serif;
        text-align: center;
        transition: opacity 240ms ease-out;
      }
      #workshop-loading[data-done] {
        opacity: 0;
        pointer-events: none;
      }
      #workshop-loading h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
      }
      #workshop-loading p {
        margin: 0;
        font-size: 14px;
        color: #7b847e;
      }
      /* Transform-only animation stays on the compositor, so it keeps moving while
         part parsing and shader compilation block the main thread. */
      #workshop-loading .loading-bar {
        position: relative;
        width: 220px;
        max-width: 100%;
        height: 6px;
        margin: 0 auto;
        overflow: hidden;
        border-radius: 3px;
        background: #dfe4e0;
      }
      #workshop-loading .loading-bar::before {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: #25714f;
        will-change: transform;
        animation: workshop-loading-slide 1.2s ease-in-out infinite;
      }
      @keyframes workshop-loading-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #workshop-loading .loading-bar::before {
          animation-duration: 3s;
        }
      }
    </style>
  </head>

  <body>
    <div id="workshop-loading" role="status" aria-live="polite">
      <h1>Brick Workshop</h1>
      <div class="loading-bar" role="progressbar" aria-label="Loading workshop"></div>
      <p data-loading-message>Loading parts...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
