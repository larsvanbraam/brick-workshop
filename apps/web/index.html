    <style>
      #workshop-loading {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-content: center;
        gap: 18px;
        padding: 24px;
        background: #f8f9f7;
        color: #303832;
        font-family: 'IBM Plex Sans', sans-serif;
        text-align: center;
        transition: opacity 240ms ease-out;
      }
      #workshop-loading[data-done] {
        opacity: 0;
        pointer-events: none;
      }
      #workshop-loading h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
      }
      #workshop-loading p {
        margin: 0;
        font-size: 14px;
        color: #7b847e;
      }
      /* Bricks drop in and stack, then lift away and start over. Transform and opacity only,
         so it stays on the compositor and keeps moving while part parsing and shader
         compilation block the main thread. */
      #workshop-loading .loading-bricks {
        position: relative;
        width: 96px;
        height: 70px;
        margin: 28px auto 0;
      }
      #workshop-loading .loading-bricks span {
        --stud: rgb(255 255 255 / 0.18);
        position: absolute;
        bottom: var(--y);
        left: var(--x);
        width: var(--w);
        height: 18px;
        border-radius: 2px;
        background: var(--c);
        box-shadow: inset 0 -4px 0 rgb(0 0 0 / 0.16);
        opacity: 0;
        will-change: transform, opacity;
        animation: workshop-brick-drop 2.8s cubic-bezier(0.5, 0, 0.75, 0) var(--d) infinite both;
      }
      /* Studs: one drawn, the rest repeated with box-shadow every 24px. */
      #workshop-loading .loading-bricks span::before {
        content: '';
        position: absolute;
        top: -4px;
        left: 6px;
        width: 12px;
        height: 4px;
        border-radius: 1px 1px 0 0;
        background: var(--c);
        box-shadow: 24px 0 var(--c);
      }
      #workshop-loading .loading-bricks span.narrow::before {
        box-shadow: none;
      }
      @keyframes workshop-brick-drop {
        0% {
          opacity: 0;
          transform: translateY(-44px);
        }
        7% {
          opacity: 1;
        }
        13% {
          transform: translateY(0);
          animation-timing-function: ease-out;
        }
        17% {
          transform: translateY(-4px);
          animation-timing-function: ease-in;
        }
        21%,
        68% {
          opacity: 1;
          transform: translateY(0);
          animation-timing-function: ease-in;
        }
        80%,
        100% {
          opacity: 0;
          transform: translateY(-14px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #workshop-loading .loading-bricks span {
          animation: workshop-brick-fade 2.8s ease-in-out var(--d) infinite both;
        }
        @keyframes workshop-brick-fade {
          0%,
          100% {
            opacity: 0.25;
          }
          30%,
          60% {
            opacity: 1;
          }
        }
      }
    </style>
  </head>

  <body>
    <div id="workshop-loading" role="status" aria-live="polite">
      <h1>Brick Workshop</h1>
      <div class="loading-bricks" role="progressbar" aria-label="Loading workshop">
        <span style="--c: #c91a09; --x: 0px; --y: 0px; --w: 48px; --d: 0s"></span>
        <span style="--c: #0055bf; --x: 48px; --y: 0px; --w: 48px; --d: 0.22s"></span>
        <span style="--c: #f2cd37; --x: 24px; --y: 22px; --w: 48px; --d: 0.44s"></span>
        <span class="narrow" style="--c: #25714f; --x: 36px; --y: 44px; --w: 24px; --d: 0.66s"></span>
      </div>
      <p data-loading-message>Loading parts...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
